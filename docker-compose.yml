services:
  db:
    image: postgres:16-alpine
    container_name: awos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: awos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - awos_db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  web:
    build:
      context: ./web
    container_name: awos_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      # Cambiamos postgres:postgres por app_user:cafeteria123
      DATABASE_URL: postgresql://app_user:cafeteria123@db:5432/awos
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  awos_db_data:
